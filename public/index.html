<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Time Credit Academy</title>
<style>
:root{--navy:#0B1F3A;--gold:#E8B23A;--cream:#F7F4EC;--ink:#1B2A41;--muted:#4A5568;--line:#D9D3C3;--bad:#A12B2B}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:.3px}
header b span{color:var(--gold)}
header .who{font-size:14px;display:flex;gap:12px;align-items:center}
main{max-width:860px;margin:0 auto;padding:24px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}
h1{font-size:24px;margin:0 0 6px;color:var(--navy)}
h2{font-size:18px;margin:0 0 12px;color:var(--navy)}
p{line-height:1.5}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:10px 12px;border:1px solid #b9b29f;border-radius:6px;font-size:16px;background:#fff}
button{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer}
button.gold{background:var(--gold);color:var(--navy)}
button.link{background:none;color:#fff;text-decoration:underline;padding:0;font-weight:500}
button.small{padding:6px 10px;font-size:13px}
button:disabled{opacity:.6;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1em}
.ok{background:#EEF6E8;border:1px solid #b9d6a6;border-radius:6px;padding:10px;font-size:14px;word-break:break-all;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.tag{display:inline-block;background:#F1E7C7;color:#6b4a00;border-radius:10px;padding:1px 8px;font-size:12px}
.seat{height:8px;background:#E7E1D0;border-radius:4px;overflow:hidden;margin-top:6px}
.seat i{display:block;height:100%;background:var(--gold)}
.bar{height:8px;background:#E7E1D0;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.wk{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
.wk.locked{opacity:.55}
.wk h3{margin:0 0 4px;font-size:16px;color:var(--navy)}
a.btn{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:8px 14px;font-size:14px;font-weight:600;text-decoration:none}
a.plain{color:var(--navy);font-weight:600}
.item{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px;background:#fff}
.item.staffonly{background:#FFF8E1;border-color:#E8B23A}
.item h3{margin:0 0 8px;font-size:17px;color:var(--navy)}
.item .rich p{margin:0 0 10px}
.item .rich h4{margin:14px 0 6px;font-size:15px;color:var(--navy)}
.item .rich ul,.item .rich ol{margin:0 0 10px;padding-left:22px;line-height:1.5}
.video{position:relative;padding-top:56.25%;margin:10px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:6px}
.check{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;font-weight:600}
.check input{width:auto}
textarea{width:100%;padding:10px 12px;border:1px solid #b9b29f;border-radius:6px;font-size:15px;font-family:inherit;min-height:140px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.crumb{font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <b>On Time <span>Credit</span> Academy</b>
  <div class="who" id="who"></div>
</header>
<main id="app"></main>
<script src="/app.js"></script>
</body>
</html>
